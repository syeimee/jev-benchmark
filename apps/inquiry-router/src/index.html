<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inquiry Router</title>
<style>
:root {
  color-scheme: light;
  --bg: #f6f6f4; --surface: #fcfcfb; --surface-2: #f0efec; --border: #e2e1dc;
  --text: #0b0b0b; --text-2: #52514e; --text-3: #7a7974;
  --s1: #2a78d6; --s1-soft: #cde2fb; --s2: #eb6834; --grid: #e8e7e3;
  --good: #0ca30c; --good-text: #006300; --critical: #d03b3b; --warning-bg: #fdf1d6;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #33332f;
    --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
    --s1: #3987e5; --s1-soft: #184f95; --s2: #d95926; --grid: #2a2a27;
    --good-text: #4cc94c; --critical: #e66767; --warning-bg: #3a3017;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #33332f;
  --text: #ffffff; --text-2: #c3c2b7; --text-3: #8f8e86;
  --s1: #3987e5; --s1-soft: #184f95; --s2: #d95926; --grid: #2a2a27;
  --good-text: #4cc94c; --critical: #e66767; --warning-bg: #3a3017;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; }
header { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
header h1 { font-size: 16px; margin: 0; }
.tabs { display: flex; gap: 4px; }
.tabs button { background: transparent; border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 10px; color: var(--text-2); }
.tabs button.on { border-bottom-color: var(--s1); color: var(--text); font-weight: 600; }
main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
.card h2 { font-size: 13px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; margin: 0 0 12px; }
textarea { width: 100%; min-height: 110px; font: inherit; color: inherit; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 10px; resize: vertical; }
button, select { font: inherit; color: inherit; background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button.primary { background: var(--s1); border-color: var(--s1); color: #fff; font-weight: 600; }
button:disabled { opacity: .5; cursor: default; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 10px; }
.row label { display: flex; gap: 6px; align-items: center; color: var(--text-2); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { font-size: 12px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 10px; cursor: pointer; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { display: flex; gap: 8px; align-items: center; border-radius: 8px; padding: 10px 12px; font-weight: 600; margin-bottom: 12px; }
.status.auto { background: var(--surface-2); color: var(--good-text); }
.status.review { background: var(--warning-bg); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; }
.answer .big { font-size: 22px; font-weight: 700; }
.badge { display: inline-block; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 6px; color: var(--text-2); margin-left: 6px; vertical-align: 3px; }
.meta { color: var(--text-3); font-size: 12px; font-variant-numeric: tabular-nums; }
.bars { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 10px; align-items: center; margin-top: 8px; font-variant-numeric: tabular-nums; }
.bars .k { font-size: 12px; }
.bars .k.on { font-weight: 700; }
.track { height: 12px; position: relative; }
.bar { position: absolute; inset: 0 auto 0 0; background: var(--s1-soft); border-radius: 0 4px 4px 0; min-width: 1px; }
.bar.on { background: var(--s1); }
.bars .v { font-size: 12px; color: var(--text-2); text-align: right; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border); }
th { font-size: 12px; font-weight: 500; color: var(--text-3); }
td.num, th.num { text-align: right; }
.table-wrap { overflow-x: auto; }
.error { color: var(--critical); margin-top: 8px; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--text-3); font-size: 11px; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.swatch { display: inline-block; width: 12px; height: 3px; border-radius: 2px; vertical-align: 3px; margin-right: 6px; }
.tooltip { position: fixed; pointer-events: none; background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: 0 4px 12px rgba(0,0,0,.15); display: none; z-index: 10; font-variant-numeric: tabular-nums; }
.empty { color: var(--text-3); text-align: center; padding: 24px; }
#tab-route, #tab-eval { display: grid; gap: 16px; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Inquiry Router</h1>
  <nav class="tabs">
    <button data-tab="route" class="on">振り分け</button>
    <button data-tab="eval">評価結果</button>
  </nav>
</header>
<main>
  <section id="tab-route">
    <div class="card">
      <h2>問い合わせ</h2>
      <textarea id="text" placeholder="問い合わせ文を入力してください"></textarea>
      <div class="row">
        <label>自動処理する confidence の下限 <input id="threshold" type="range" min="0" max="0.9" step="0.05" value="0.5"> <b id="thresholdValue">0.50</b></label>
        <label>下回ったら
          <select id="fallback"><option value="human">人の確認に回す</option><option value="gpt">GPT に判定させる</option></select>
        </label>
        <button id="submit" class="primary">振り分ける</button>
      </div>
      <div class="chips" id="examples"></div>
      <div class="error" id="error" hidden></div>
    </div>
    <div class="card" id="result" hidden></div>
    <div class="card" id="history" hidden></div>
  </section>
  <section id="tab-eval" hidden></section>
</main>
<div class="tooltip" id="tooltip"></div>
<script>
'use strict';
function h(tag, attrs, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'style') el.style.cssText = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const svgNS = 'http://www.w3.org/2000/svg';
function s(tag, attrs, ...children) {
  const el = document.createElementNS(svgNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) if (v != null) el.setAttribute(k, v);
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}
const pct = (x) => (x == null ? '-' : `${Math.round(x * 100)}%`);
const $ = (id) => document.getElementById(id);
const tooltip = $('tooltip');
function tip(e, lines) {
  tooltip.replaceChildren(...lines.map((l) => h('div', null, l)));
  tooltip.style.display = 'block';
  tooltip.style.left = Math.min(e.clientX + 12, innerWidth - tooltip.offsetWidth - 8) + 'px';
  tooltip.style.top = e.clientY + 12 + 'px';
}
const untip = () => (tooltip.style.display = 'none');

let meta = { departments: {}, urgencies: {}, examples: [] };
const history = [];

// ---------- tabs ----------
for (const b of document.querySelectorAll('.tabs button')) {
  b.addEventListener('click', () => {
    for (const x of document.querySelectorAll('.tabs button')) x.classList.toggle('on', x === b);
    $('tab-route').hidden = b.dataset.tab !== 'route';
    $('tab-eval').hidden = b.dataset.tab !== 'eval';
    if (b.dataset.tab === 'eval') loadEval();
  });
}

// ---------- route ----------
$('threshold').addEventListener('input', (e) => ($('thresholdValue').textContent = Number(e.target.value).toFixed(2)));

function showExamples() {
  const picks = [...meta.examples].sort(() => Math.random() - 0.5).slice(0, 6);
  $('examples').replaceChildren(
    h('span', { class: 'meta' }, '例:'),
    ...picks.map((x) => h('span', { class: 'chip', title: x.text, onclick: () => ($('text').value = x.text) }, x.text)),
    h('span', { class: 'chip', onclick: showExamples }, '別の例'),
  );
}

function sourceBadge(d) {
  if (d.source === 'rule') return h('span', { class: 'badge' }, `ルール: ${d.rule}`);
  if (d.source === 'gpt') return h('span', { class: 'badge' }, 'GPT');
  return h('span', { class: 'badge' }, `Jev · confidence ${d.confidence == null ? '不明' : d.confidence.toFixed(2)}`);
}

function answerPanel(title, d, labels, low) {
  const probs = d.probabilities;
  const keys = Object.keys(labels);
  return h('div', { class: 'answer' },
    h('div', { class: 'meta' }, title, low ? ' · confidence が下限未満' : ''),
    h('div', null, h('span', { class: 'big' }, labels[d.value] ?? d.value), sourceBadge(d)),
    probs ? h('div', { class: 'bars' }, keys.map((k) => [
      h('span', { class: 'k' + (k === d.value ? ' on' : '') }, labels[k]),
      h('div', { class: 'track', onmousemove: (e) => tip(e, [labels[k], `確率 ${pct(probs[k])}`]), onmouseleave: untip },
        h('div', { class: 'bar' + (k === d.value ? ' on' : ''), style: `width:${((probs[k] ?? 0) * 100).toFixed(1)}%` })),
      h('span', { class: 'v' }, pct(probs[k])),
    ])) : null,
  );
}

function renderResult(r) {
  const review = r.status === 'needs_review';
  const qName = { department: '部署', urgency: '緊急度' };
  $('result').hidden = false;
  $('result').replaceChildren(
    h('div', { class: 'status ' + (review ? 'review' : 'auto') },
      review ? '⚠ 人の確認が必要' : '✓ 自動で振り分け',
      h('span', { class: 'meta', style: 'font-weight:400' },
        review ? `（${r.lowConfidence.map((q) => qName[q]).join('・')}の confidence が下限未満。表示は Jev の提案）`
          : r.gpt ? `（${r.lowConfidence.map((q) => qName[q]).join('・')}は GPT が判定）` : '')),
    h('div', { class: 'grid2' },
      answerPanel('部署', r.department, meta.departments, r.lowConfidence.includes('department')),
      answerPanel('緊急度', r.urgency, meta.urgencies, r.lowConfidence.includes('urgency'))),
    h('div', { class: 'meta', style: 'margin-top:12px' },
      `処理時間 ${r.latencyMs}ms · コスト $${r.costUsd.toFixed(6)}` + (r.gpt ? ` · GPT の理由: ${r.gpt.reasoning}` : '')),
  );
}

function renderHistory() {
  $('history').hidden = history.length === 0;
  $('history').replaceChildren(
    h('h2', null, 'この画面での履歴'),
    h('div', { class: 'table-wrap' }, h('table', null,
      h('thead', null, h('tr', null, ['問い合わせ', '部署', '緊急度', '状態', '時間'].map((t, i) => h('th', { class: i === 4 ? 'num' : null }, t)))),
      h('tbody', null, history.map(({ text, r }) => h('tr', null,
        h('td', null, text.length > 40 ? text.slice(0, 40) + '…' : text),
        h('td', null, meta.departments[r.department.value]),
        h('td', null, meta.urgencies[r.urgency.value]),
        h('td', null, r.status === 'needs_review' ? '⚠ 確認待ち' : '✓ 自動'),
        h('td', { class: 'num' }, `${r.latencyMs}ms`),
      ))),
    )),
  );
}

$('submit').addEventListener('click', async () => {
  const text = $('text').value.trim();
  if (!text) return;
  $('submit').disabled = true;
  $('error').hidden = true;
  try {
    const res = await fetch('/api/route', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ text, threshold: Number($('threshold').value), fallback: $('fallback').value }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || res.statusText);
    renderResult(data);
    history.unshift({ text, r: data });
    renderHistory();
  } catch (e) {
    $('error').textContent = `エラー: ${e.message}`;
    $('error').hidden = false;
  } finally {
    $('submit').disabled = false;
  }
});

// ---------- eval ----------
function accuracyTable(a) {
  const names = { keyword: 'キーワードルールのみ', jev: 'Jev のみ', rulesThenJev: 'ルール → Jev', gpt: 'GPT のみ' };
  return h('table', null,
    h('thead', null, h('tr', null, ['方式', '部署', '緊急度', '両方'].map((t, i) => h('th', { class: i ? 'num' : null }, t)))),
    h('tbody', null, Object.entries(a).filter(([, v]) => v).map(([k, v]) => h('tr', null,
      h('td', null, names[k] ?? k), h('td', { class: 'num' }, pct(v.department)), h('td', { class: 'num' }, pct(v.urgency)), h('td', { class: 'num' }, pct(v.both))))),
  );
}

function bandsTable(bands) {
  return h('table', null,
    h('thead', null, h('tr', null, ['confidence', '件数', 'Jev の正解率'].map((t, i) => h('th', { class: i ? 'num' : null }, t)))),
    h('tbody', null, bands.map((b) => h('tr', null,
      h('td', null, `${b.lo.toFixed(1)}〜${b.hi.toFixed(1)}`), h('td', { class: 'num' }, b.n), h('td', { class: 'num' }, pct(b.accuracy))))),
  );
}

// Coverage and accuracy share one 0–100% axis, so a single chart with two series is honest here.
function thresholdChart(points) {
  const W = 640, H = 220, pl = 36, pr = 60, pt = 12, pb = 28;
  const xs = points.map((p) => p.threshold);
  const x = (t) => pl + ((t - xs[0]) / (xs.at(-1) - xs[0])) * (W - pl - pr);
  const y = (v) => pt + (1 - v) * (H - pt - pb);
  const series = [
    { name: '自動処理できる割合', color: 'var(--s1)', get: (p) => p.coverage },
    { name: '自動処理した分の正解率（両方）', color: 'var(--s2)', get: (p) => p.autoAccuracy.both },
  ];
  const svg = s('svg', { class: 'chart', viewBox: `0 0 ${W} ${H}`, role: 'img', 'aria-label': '閾値ごとの自動処理率と正解率' },
    [0, 0.25, 0.5, 0.75, 1].map((v) => [
      s('line', { x1: pl, x2: W - pr, y1: y(v), y2: y(v), stroke: 'var(--grid)' }),
      s('text', { x: pl - 6, y: y(v) + 4, 'text-anchor': 'end' }, `${v * 100}%`),
    ]),
    xs.map((t) => s('text', { x: x(t), y: H - 8, 'text-anchor': 'middle' }, t.toFixed(1))),
    series.map((se) => [
      s('path', { d: points.map((p, i) => `${i ? 'L' : 'M'}${x(p.threshold)},${y(se.get(p))}`).join(''), fill: 'none', stroke: se.color, 'stroke-width': 2, 'stroke-linejoin': 'round' }),
      points.map((p) => s('circle', { cx: x(p.threshold), cy: y(se.get(p)), r: 4, fill: se.color, stroke: 'var(--surface)', 'stroke-width': 2 })),
      s('text', { x: W - pr + 6, y: y(se.get(points.at(-1))) + 4 }, pct(se.get(points.at(-1)))),
    ]),
  );
  const hit = s('rect', { x: pl, y: pt, width: W - pl - pr, height: H - pt - pb, fill: 'transparent' });
  hit.addEventListener('mousemove', (e) => {
    const r = svg.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    const p = points.reduce((a, b) => (Math.abs(x(b.threshold) - px) < Math.abs(x(a.threshold) - px) ? b : a));
    tip(e, [`下限 ${p.threshold.toFixed(1)}`, `自動処理 ${pct(p.coverage)}`, `その正解率 ${pct(p.autoAccuracy.both)}`]);
  });
  hit.addEventListener('mouseleave', untip);
  svg.append(hit);
  return h('div', null,
    h('div', { class: 'legend' }, series.map((se) => h('span', null, h('span', { class: 'swatch', style: `background:${se.color}` }), se.name))),
    svg,
    h('div', { class: 'meta' }, '横軸: 自動処理する confidence の下限。下限を上げるほど人に回す件数が増え、自動処理した分の正解率が上がる。'),
  );
}

async function loadEval() {
  const r = await fetch('/api/eval/latest').then((x) => x.json());
  const root = $('tab-eval');
  if (!r) {
    root.replaceChildren(h('div', { class: 'card empty' }, 'まだ評価結果がありません。npm run eval -w apps/inquiry-router を実行してください。'));
    return;
  }
  const misses = r.rows.filter((x) => x.jev.department.choice !== x.item.department);
  root.replaceChildren(
    h('div', { class: 'card' },
      h('h2', null, `評価結果（${r.n} 件 · ${new Date(r.createdAt).toLocaleString()} · $${r.costUsd.toFixed(4)} · Jev 中央値 ${r.latencyMs.jevMedian}ms）`),
      h('div', { class: 'table-wrap' }, accuracyTable(r.accuracy))),
    h('div', { class: 'card' }, h('h2', null, 'confidence の下限と自動処理率・正解率'), thresholdChart(r.thresholds)),
    h('div', { class: 'grid2' },
      h('div', { class: 'card' }, h('h2', null, 'confidence 別の正解率（部署）'), bandsTable(r.confidenceBands.department)),
      h('div', { class: 'card' }, h('h2', null, 'confidence 別の正解率（緊急度）'), bandsTable(r.confidenceBands.urgency))),
    h('div', { class: 'card' },
      h('h2', null, `Jev が部署を間違えた問い合わせ（${misses.length} 件）`),
      h('div', { class: 'table-wrap' }, h('table', null,
        h('thead', null, h('tr', null, ['#', '問い合わせ', '正解', 'Jev', 'confidence'].map((t, i) => h('th', { class: i === 4 ? 'num' : null }, t)))),
        h('tbody', null, misses.map((x) => h('tr', null,
          h('td', null, x.item.id), h('td', null, x.item.text),
          h('td', null, meta.departments[x.item.department]), h('td', null, meta.departments[x.jev.department.choice]),
          h('td', { class: 'num' }, x.jev.department.confidence?.toFixed(2) ?? '-'))))))),
  );
}

fetch('/api/meta').then((r) => r.json()).then((m) => {
  meta = m;
  showExamples();
  if (location.hash === '#eval') document.querySelector('[data-tab="eval"]').click();
  // #try=<text> fills in and routes an inquiry, so a result can be linked to.
  if (location.hash.startsWith('#try=')) {
    $('text').value = decodeURIComponent(location.hash.slice(5));
    $('submit').click();
  }
});
</script>
</body>
</html>
